name: Build Google Play Store Bundle (AAB) & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-playstore:
    name: Build Signed AAB & APK for Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Production Release Keystore
        run: |
          mkdir -p android/app/keystore
          keytool -genkey -v -keystore android/app/keystore/release.keystore \
            -alias vision365 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass Vision365SecretPass \
            -keypass Vision365SecretPass \
            -dname "CN=Vision365, OU=Mobile, O=Abduhakimov, L=Tashkent, ST=Tashkent, C=UZ"

      - name: Configure Release Signing in Gradle
        run: |
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('keystore/release.keystore')
                      storePassword 'Vision365SecretPass'
                      keyAlias 'vision365'
                      keyPassword 'Vision365SecretPass'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Build Google Play Store Bundle (.aab)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Build Release APK (.apk)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Upload Play Store AAB Bundle (Directly upload to Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: Vision365-PlayStore-Bundle-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Test Release APK (For Direct Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: Vision365-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
